# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

# CodeRabbit reviews are dispatched by Avkroken's label-driven review router.
# Keep local overrides limited to the router contract and repository-specific
# review guidance; organization settings own shared review/status behavior.
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 0
    drafts: true
    labels:
      - review:coderabbit
  path_instructions:
    - path: "**/*.tf"
      instructions: |
        Review Terraform as production infrastructure.
        Flag secret or state leakage, unintended replacement or destruction,
        excessive privileges, unsafe provider or module changes, and changes
        that conflict with the repository's documented resource-ownership and
        lifecycle protections. Treat removal or weakening of protections such
        as prevent_destroy as security- and availability-sensitive.
