name: Terraform check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform / required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact GitHub ref
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Install repository Terraform version
        shell: bash
        run: |
          set -euo pipefail
          terraform_version="$(cat .terraform-version)"
          archive="terraform_${terraform_version}_linux_amd64.zip"
          release_url="https://releases.hashicorp.com/terraform/${terraform_version}"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "${archive}" "${release_url}/${archive}"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output SHA256SUMS "${release_url}/terraform_${terraform_version}_SHA256SUMS"
          grep " ${archive}$" SHA256SUMS | sha256sum --check --strict -
          unzip -q "${archive}" -d "${RUNNER_TEMP}/terraform-bin"
          echo "${RUNNER_TEMP}/terraform-bin" >> "${GITHUB_PATH}"

      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform validate
