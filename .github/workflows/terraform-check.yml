name: Terraform check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform / required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install latest stable Terraform
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output terraform-releases.html \
            https://releases.hashicorp.com/terraform/

          terraform_version="$(
            python3 <<'PY'
          import re

          with open("terraform-releases.html", encoding="utf-8") as handle:
              releases = handle.read()

          pattern = re.compile(r"terraform_(\d+)\.(\d+)\.(\d+)(?![-0-9A-Za-z.])")
          versions = {tuple(map(int, match.groups())) for match in pattern.finditer(releases)}
          if not versions:
              raise SystemExit("No stable Terraform release found")

          print(".".join(map(str, max(versions))))
          PY
          )"
          echo "Using latest stable Terraform ${terraform_version}"

          archive="terraform_${terraform_version}_linux_amd64.zip"
          release_url="https://releases.hashicorp.com/terraform/${terraform_version}"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "${archive}" "${release_url}/${archive}"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output SHA256SUMS "${release_url}/terraform_${terraform_version}_SHA256SUMS"
          checksum_line="$(awk -v archive="${archive}" '$2 == archive { print; exit }' SHA256SUMS)"
          test -n "${checksum_line}"
          printf '%s\n' "${checksum_line}" | sha256sum --check --strict -
          unzip -q "${archive}" -d "${RUNNER_TEMP}/terraform-bin"
          echo "${RUNNER_TEMP}/terraform-bin" >> "${GITHUB_PATH}"

      - name: Verify Terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
