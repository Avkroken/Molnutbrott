version: 2
updates:
  - package-ecosystem: "github-actions"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "05:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    assignees: ["blixten85"]
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "05:10"
      timezone: "Europe/Stockholm"
    groups:
      terraform-patch-minor:
        update-types: ["minor", "patch"]
